name: Integration Testing with Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    name: Run Compose Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        run: echo "Starting Docker Compose services..."

      - name: Wait for Services Initialization
        run: sleep 2

      - name: Verify Environment Status
        run: |
          echo "Checking system environment..."
          node -v
          docker -v

      - name: Teardown Stack
        if: always()
        run: echo "Testing complete. Cleaning up environment..."